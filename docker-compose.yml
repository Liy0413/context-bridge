services:
  context-bridge:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - context-bridge-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  context-bridge-data:
